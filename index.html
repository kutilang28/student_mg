<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CRUD Mahasiswa - NestJS & Prisma</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <h1 class="text-2xl font-bold text-slate-900">Manajemen Data Mahasiswa</h1>

    <!-- Alert Pesan -->
    <div id="alertBox" class="hidden p-3 rounded text-sm font-medium"></div>

    <!-- Form Tambah / Edit -->
    <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
      <h2 id="formTitle" class="text-lg font-semibold mb-4">Tambah Mahasiswa</h2>
      <form id="studentForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input type="hidden" id="studentId" />

        <div>
          <label class="block text-xs font-medium mb-1">NIM</label>
          <input type="text" id="nim" required
            class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1">Nama Lengkap</label>
          <input type="text" id="name" required 
            class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1">Email</label>
          <input type="email" id="email" required 
            class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1">Jurusan</label>
          <input type="text" id="major" required
            class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1">Semester</label>
          <input type="number" id="semester" min="1" max="14" value="1" required
            class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-medium mb-1">IPK (GPA)</label>
          <input type="number" id="gpa" step="0.01" min="0" max="4" value="0.00" required
            class="w-full border rounded px-3 py-2 text-sm focus:outline-blue-500" />
        </div>

        <div class="md:col-span-3 flex gap-2 pt-2">
          <button type="submit" id="submitBtn"
            class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded">
            Simpan Data
          </button>
          <button type="button" id="cancelBtn" onclick="resetForm()"
            class="hidden bg-slate-300 hover:bg-slate-400 text-slate-800 text-sm font-medium px-4 py-2 rounded">
            Batal Edit
          </button>
        </div>
      </form>
    </div>

    <!-- Tabel Data -->
    <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <h2 class="text-lg font-semibold">Daftar Mahasiswa</h2>
        <div class="flex gap-2">
          <input type="text" id="filterMajor" placeholder="Filter jurusan..."
            class="border rounded px-3 py-1.5 text-sm focus:outline-blue-500" />
          <button onclick="loadStudents()"
            class="bg-slate-800 hover:bg-slate-900 text-white text-sm px-3 py-1.5 rounded">
            Cari
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b bg-slate-50 text-slate-600">
              <th class="p-3">NIM</th>
              <th class="p-3">Nama</th>
              <th class="p-3">Email</th>
              <th class="p-3">Jurusan</th>
              <th class="p-3">Sem</th>
              <th class="p-3">IPK</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="studentTableBody" class="divide-y">
            <tr>
              <td colspan="7" class="p-4 text-center text-slate-400">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:3000/students';
    const form = document.getElementById('studentForm');
    const tableBody = document.getElementById('studentTableBody');
    const alertBox = document.getElementById('alertBox');

    function showAlert(message, isError = false) {
      alertBox.textContent = message;
      alertBox.className = `p-3 rounded text-sm font-medium ${
        isError ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'
      }`;
      alertBox.classList.remove('hidden');
      setTimeout(() => alertBox.classList.add('hidden'), 3500);
    }

    async function loadStudents() {
      const major = document.getElementById('filterMajor').value.trim();
      const url = major ? `${API_URL}?major=${encodeURIComponent(major)}` : API_URL;

      try {
        const res = await fetch(url);
        const result = await res.json();
        const students = Array.isArray(result) ? result : (result.data || []);

        if (students.length === 0) {
          tableBody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-slate-400">Belum ada data mahasiswa.</td></tr>`;
          return;
        }

        tableBody.innerHTML = students.map(s => `
          <tr class="hover:bg-slate-50">
            <td class="p-3 font-mono">${s.nim}</td>
            <td class="p-3 font-medium">${s.name}</td>
            <td class="p-3 text-slate-600">${s.email || '-'}</td>
            <td class="p-3">${s.major}</td>
            <td class="p-3">${s.semester ?? '-'}</td>
            <td class="p-3">${s.gpa ?? '-'}</td>
            <td class="p-3 text-center space-x-1">
              <button onclick='editStudent(${JSON.stringify(s)})'
                class="bg-amber-500 hover:bg-amber-600 text-white text-xs px-2.5 py-1 rounded">
                Edit
              </button>
              <button onclick="deleteStudent(${s.id})"
                class="bg-red-600 hover:bg-red-700 text-white text-xs px-2.5 py-1 rounded">
                Hapus
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tableBody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-red-500">Gagal terhubung ke server NestJS.</td></tr>`;
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('studentId').value;

      const payload = {
        nim: document.getElementById('nim').value,
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        major: document.getElementById('major').value,
        semester: Number(document.getElementById('semester').value),
        gpa: Number(document.getElementById('gpa').value),
      };

      const method = id ? 'PATCH' : 'POST';
      const endpoint = id ? `${API_URL}/${id}` : API_URL;

      try {
        const res = await fetch(endpoint, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || 'Terjadi kesalahan saat menyimpan data');
        }

        showAlert(id ? 'Data mahasiswa berhasil diperbarui!' : 'Mahasiswa baru berhasil ditambahkan!');
        resetForm();
        loadStudents();
      } catch (err) {
        showAlert(err.message, true);
      }
    });
    function editStudent(student) {
      document.getElementById('studentId').value = student.id;
      document.getElementById('nim').value = student.nim;
      document.getElementById('name').value = student.name;
      document.getElementById('email').value = student.email || '';
      document.getElementById('major').value = student.major;
      document.getElementById('semester').value = student.semester ?? 1;
      document.getElementById('gpa').value = student.gpa ?? 0;

      document.getElementById('formTitle').textContent = `Edit Mahasiswa (ID: ${student.id})`;
      document.getElementById('submitBtn').textContent = 'Update Data';
      document.getElementById('cancelBtn').classList.remove('hidden');
    }

    function resetForm() {
      form.reset();
      document.getElementById('studentId').value = '';
      document.getElementById('formTitle').textContent = 'Tambah Mahasiswa';
      document.getElementById('submitBtn').textContent = 'Simpan Data';
      document.getElementById('cancelBtn').classList.add('hidden');
    }
    async function deleteStudent(id) {
      if (!confirm('Yakin ingin menghapus data mahasiswa ini?')) return;

      try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Gagal menghapus data');

        showAlert('Data mahasiswa berhasil dihapus!');
        loadStudents();
      } catch (err) {
        showAlert(err.message, true);
      }
    }
    loadStudents();
  </script>
</body>
</html>
